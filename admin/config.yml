
backend:
  name: git-gateway
  branch: main

site_url: "https://elegant-sorbet-0a6bf5.netlify.app"
display_url: "https://elegant-sorbet-0a6bf5.netlify.app"

media_folder: "images"
public_folder: "/images"

locale: "fr"

collections:
  - name: "pages"
    label: "Pages du site"
    files:
      - name: "accueil"
        label: "Page d'accueil"
        file: "content/accueil.json"
        format: "json"
        fields:
          - label: "Titre du site"
            name: "titre"
            widget: "string"
          - label: "Slogan"
            name: "slogan"
            widget: "string"
          - label: "Titre d'accueil"
            name: "titre_accueil"
            widget: "string"
          - label: "Texte d'accueil"
            name: "texte_accueil"
            widget: "text"

      - name: "planning"
        label: "Plannings et PDF"
        file: "content/planning.json"
        format: "json"
        fields:
          - label: "Titre du planning"
            name: "titre"
            widget: "string"
          - label: "Document PDF"
            name: "pdf"
            widget: "file"
            media_folder: "/documents"
            public_folder: "/documents"
            allow_multiple: false
            required: false
            media_library:
              config:
                multiple: false
                max_file_size: 10000000
