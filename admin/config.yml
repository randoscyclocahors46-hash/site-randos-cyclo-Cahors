
backend:
  name: git-gateway
  branch: main

site_url: "https://elegant-sorbet-0a6bf5.netlify.app"
display_url: "https://elegant-sorbet-0a6bf5.netlify.app"

media_folder: "images"
public_folder: "/images"

locale: "fr"

collections:
  - name: "pages"
    label: "Pages du site"
    files:
      - name: "accueil"
        label: "Page d'accueil"
        file: "index.html"
        fields:
          - label: "Contenu HTML"
            name: "body"
            widget: "text"
