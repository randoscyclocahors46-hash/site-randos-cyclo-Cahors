backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "fr"

collections:
  - name: "pages"
    label: "Pages du site"
    files:
      - name: "accueil"
        label: "Page d'accueil"
        file: "index.html"
        fields:
          - { label: "Contenu HTML", name: "body", widget: "text" }
